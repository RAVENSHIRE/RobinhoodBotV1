[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hoodscout-robinhood"
version = "0.1.0"
description = "Read-only Robinhood Chain Uniswap V3 scanner, model gates, paper-trading and replay dashboard"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "python-dotenv>=1,<2", "rich>=13,<16"]

[project.scripts]
hoodscout = "hoodscout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hoodscout = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
